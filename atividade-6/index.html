<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Tropical - Pitaya 🌵</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container"><span>🌵</span></div>
        <h1>Pitaya Acadêmico</h1>
        <p>Sistema de Avaliação de Notas</p>
    </header>

    <main>
        <form id="formNotas">
            <div class="campo">
                <label for="nota1">Primeira Nota:</label>
                <input type="number" id="nota1" step="0.1" placeholder="0 a 10" required>
            </div>

            <div class="campo">
                <label for="nota2">Segunda Nota:</label>
                <input type="number" id="nota2" step="0.1" placeholder="0 a 10" required>
            </div>

            <div class="campo">
                <label for="nota3">Terceira Nota:</label>
                <input type="number" id="nota3" step="0.1" placeholder="0 a 10" required>
            </div>

            <button type="submit">Calcular Média 🌸</button>
        </form>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
