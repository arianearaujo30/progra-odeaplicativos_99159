<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Tropical - Abacaxi 🍍</title>
    <style>
        /* ESTILO TEMA ABACAXI */
        body {
            background-color: #fff9db; /* Amarelo bem clarinho */
            font-family: 'Trebuchet MS', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #5d4037; /* Marrom para contraste */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container {
            font-size: 60px;
            background: #fff;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; /* Formato levemente irregular de fruta */
            border: 4px solid #fcc419;
            margin: 0 auto 10px;
            box-shadow: 0 4px 10px rgba(252, 196, 25, 0.3);
        }

        h1 {
            color: #e67e22; /* Laranja abacaxi */
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 30px;
            border: 4px solid #fcc419;
            box-shadow: 10px 10px 0px #ffec99; /* Sombra sólida tropical */
            width: 100%;
            max-width: 320px;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2f9e44; /* Verde da coroa */
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffec99;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #fcc419;
        }

        button {
            background-color: #2f9e44; /* Verde folha */
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #2b8a3e;
            transition: 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #40c057;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* RESULTADO */
        #resultado {
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            display: none;
            font-weight: bold;
        }

        .aprovado {
            background-color: #ebfbee;
            border: 3px solid #40c057;
            color: #2b8a3e;
        }

        .reprovado {
            background-color: #fff5f5;
            border: 3px solid #ff6b6b;
            color: #c92a2a;
        }

        .nota-final {
            font-size: 2rem;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">🍍</div>
        <h1>Calculadora Tropical</h1>
    </header>

    <form id="formNotas">
        <div class="campo">
            <label for="nota1">Primeira Nota:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" required>
        </div>

        <div class="campo">
            <label for="nota2">Segunda Nota:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" required>
        </div>

        <div class="campo">
            <label for="nota3">Terceira Nota:</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" required>
        </div>

        <button type="submit">Calcular Média ☀️</button>
    </form>

    <div id="resultado"></div>

    <script>
        const form = document.getElementById('formNotas');
        const resDiv = document.getElementById('resultado');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const n1 = parseFloat(document.getElementById('nota1').value);
            const n2 = parseFloat(document.getElementById('nota2').value);
            const n3 = parseFloat(document.getElementById('nota3').value);

            const media = (n1 + n2 + n3) / 3;
            
            let msg, classe;
            if (media >= 7) {
                msg = "Aprovado! Você é o rei da praia! 🏄‍♂️";
                classe = "aprovado";
            } else {
                msg = "Reprovado. Deu ruim no verão! ☔";
                classe = "reprovado";
            }

            resDiv.className = classe;
            resDiv.style.display = 'block';
            resDiv.innerHTML = `
                <span class="nota-final">${media.toFixed(1)}</span>
                <p>${msg}</p>
            `;
        });
    </script>

</body>
</html>
