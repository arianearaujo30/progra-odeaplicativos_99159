<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quitanda Laranja - Calculadora de Maçãs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">🍊</div>
        <h1>Quitanda Laranja</h1>
        <p>Preços especiais para você!</p>
    </header>

    <main>
        <form id="formMacas">
            <div class="campo">
                <label for="quantidade">Quantas maçãs você deseja?</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 15" required>
            </div>

            <button type="submit">Calcular Valor 🛒</button>
        </form>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
